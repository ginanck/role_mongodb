---

- name: Install MongoDB {{ mongodb__repo__version }}
  when:
    - "{{ mongodb__install }} is true"
    - ansible_architecture in ['x86_64']
    - ansible_distribution in ['CentOS', 'RedHat', 'AlmaLinux']
    - ansible_distribution_major_version in ['7', '8']
  import_tasks: mongo-install.yml

- name: Remove MongoDB {{ mongodb__repo__version }}
  when:
    - "{{ mongodb__install }} is false"
    - ansible_architecture in ['x86_64']
    - ansible_distribution in ['CentOS', 'RedHat', 'AlmaLinux']
    - ansible_distribution_major_version in ['7', '8']
  import_tasks: mongo-remove.yml
