- name: configure mongod.conf file
  template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: '0644'

- name: enable and start mongodb service
  systemd:
    name: mongod
    state: started
    enabled: yes
